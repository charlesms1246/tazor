[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "./test/fixtures" }, { access = "read", path = "./out" }]
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "@openzeppelin/community-contracts/=lib/openzeppelin-community-contracts/contracts/",
]

[rpc_endpoints]
whitechain_testnet = "https://rpc.testnet.whitechain.io"
whitechain = "https://rpc.whitechain.io"
sepolia = "https://ethereum-sepolia-rpc.publicnode.com"
